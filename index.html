<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बिश्रामपुर गाउँपालिका - भू-उपयोग वर्गीकरण</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Noto Sans Devanagari", sans-serif;
      background-color: #f8f9fa;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 30px;
      background: #4C4CFF;
      border-bottom: 2px solid #dee2e6;
      position: relative;
    }
    .header-bar img {
      height: 75px;
    }
    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      color: #ffffff;
      line-height: 1.6;
    }
    .card-custom {
      border-radius: 15px;
      border: none;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }
    #main-content {
      display: none; /* Hidden until login */
    }
    #login-card {
      max-width: 400px;
      margin: 100px auto;
      border-radius: 15px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      padding: 30px;
      background-color: white;
    }
  </style>
</head>
<body>
  <!-- Header Section -->
  <div class="header-bar">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Emblem_of_Nepal_%28alternative%29.svg/256px-Emblem_of_Nepal_%28alternative%29.svg.png?20221020092322">
    <div class="header-title"><br>
      बिश्रामपुर गाउँपालिका<br>
      गाउँ कार्यपालिकाको कार्यालय<br>
      बिश्रामपुर, बारा<br>
      मधेश प्रदेश<br>
    </div>
    <img src="https://giwmscdntwo.gov.np/static/grapejs/img/Nepal-flag.gif" alt="NepalFlag">
  </div>

  <!-- 🔐 Login Page -->
  <div id="login-card" class="card">
    <h4 class="text-center mb-4">लगइन गर्नुहोस्</h4>
    <div class="mb-3">
      <label for="username" class="form-label">प्रयोगकर्ता नाम:</label>
      <input type="text" id="username" class="form-control" placeholder="Username राख्नुहोस्">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">पासवर्ड:</label>
      <input type="password" id="password" class="form-control" placeholder="Password राख्नुहोस्">
    </div>
    <button class="btn btn-primary w-100" onclick="login()">Login</button>
    <p id="login-error" class="text-danger text-center mt-3" style="display:none;">❌ गलत प्रयोगकर्ता नाम वा पासवर्ड !</p>
  </div>

  <!-- 🧭 Main Content -->
  <div id="main-content" class="container mt-5">
    <br><br>
    <h2 class="text-center">बिश्रामपुर गाउँपालिका कित्तागत विवरण </h2>
    <div class="container mt-5">
      <div class="card card-custom p-4 shadow">
        <!-- VDC Dropdown -->
        <label for="vdc" class="form-label">गा.वि.स.:</label>
        <select id="vdc" class="form-select mb-3" onchange="populateWards()">
          <option value="">-- गाविस छान्नुस --</option>
        </select>

        <!-- Ward Dropdown -->
        <label for="ward" class="form-label">वडा नं/सिट नं:</label>
        <select id="ward" class="form-select mb-3">
          <option value="">-- वार्ड छान्नुस --</option>
        </select>

        <!-- Parcel ID Input -->
        <label for="parcel" class="form-label">कित्ता नं:</label>
        <input type="text" id="parcel" class="form-control mb-3" placeholder="कित्ता नं राख्नुस">

        <!-- Query Button -->
        <button id="searchBtn" class="btn btn-primary w-100 mt-3" onclick="queryData()">🔍 Search</button>

        <!-- Progress Bar -->
        <div class="progress mt-3" style="display: none;">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 100%"></div>
        </div>
      </div>
      <div id="results" class="mt-5"></div>
    </div>
  </div>

  <script>
    // Simple Login Validation
    const validUsername = "bishrampur";   // 🔑 you can change this
    const validPassword = "12345";   // 🔒 you can change this

    function login() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (user === validUsername && pass === validPassword) {
        document.getElementById("login-card").style.display = "none";
        document.getElementById("main-content").style.display = "block";
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    }
  </script>

  <!-- Your existing script file -->
  <script src="script.js"></script>
</body>
</html>
